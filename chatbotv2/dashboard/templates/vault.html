{% extends "dashboard.html" %}
{% block nav_vault %}active{% endblock %}
{% block page_title %}Vault{% endblock %}

{% block extra_head %}
<style>
    .page-header { margin-bottom: 24px; }
    .page-header h2 { font-size: 20px; font-weight: 700; color: var(--text-primary); margin-bottom: 4px; }
    .page-header p { font-size: 13px; color: var(--text-secondary); }

    .vault-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
    @media (max-width: 1024px) { .vault-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 640px) { .vault-grid { grid-template-columns: 1fr; } }

    .stat-card {
        background: var(--bg-card); border: 1px solid var(--border-color);
        border-radius: 12px; padding: 20px; position: relative; overflow: hidden;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .stat-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
    .stat-card::after {
        content: ''; position: absolute; top: -20px; right: -20px;
        width: 80px; height: 80px; border-radius: 50%;
        filter: blur(32px); opacity: 0.18; pointer-events: none;
    }
    .stat-card.purple::after { background: var(--accent-purple); }
    .stat-card.green::after  { background: var(--accent-green); }
    .stat-card.orange::after { background: var(--accent-orange); }
    .stat-card.blue::after   { background: #3B82F6; }
    .stat-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 12px; }
    .stat-label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-secondary); }
    .stat-icon {
        width: 36px; height: 36px; border-radius: 8px;
        display: flex; align-items: center; justify-content: center; font-size: 16px;
    }
    .stat-icon.purple { background: rgba(108,99,255,0.15); color: var(--accent-purple); }
    .stat-icon.green  { background: rgba(74,222,128,0.15);  color: var(--accent-green); }
    .stat-icon.orange { background: rgba(251,146,60,0.15);  color: var(--accent-orange); }
    .stat-icon.blue   { background: rgba(59,130,246,0.15);  color: #3B82F6; }
    .stat-value { font-size: 28px; font-weight: 700; color: var(--text-primary); line-height: 1.2; }
    .stat-sub { font-size: 12px; color: var(--text-tertiary); margin-top: 4px; }

    .section-card {
        background: var(--bg-card); border: 1px solid var(--border-color);
        border-radius: 12px; padding: 20px; overflow: hidden; margin-bottom: 20px;
    }
    .section-header {
        display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;
    }
    .section-header h2 { font-size: 16px; font-weight: 600; color: var(--text-primary); }

    .status-badge {
        display: inline-flex; align-items: center; gap: 6px;
        padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 600;
    }
    .status-badge.active { background: rgba(74,222,128,0.15); color: var(--accent-green); }
    .status-badge.error { background: rgba(239,68,68,0.15); color: var(--accent-red); }
    .status-badge.pending { background: rgba(251,146,60,0.15); color: var(--accent-orange); }

    .empty-state { text-align: center; padding: 48px 20px; color: var(--text-tertiary); }
    .empty-state i { font-size: 32px; margin-bottom: 12px; display: block; }
    .empty-state p { font-size: 14px; }
    .empty-state .empty-sub { font-size: 12px; margin-top: 4px; color: var(--text-tertiary); }

    .loading-text { font-size: 14px; color: var(--text-tertiary); padding: 24px 0; text-align: center; }
    .error-state {
        background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.2);
        color: var(--accent-red); padding: 12px 16px; border-radius: 8px;
        font-size: 13px; margin-bottom: 16px;
    }

    .btn-sync {
        display: inline-flex; align-items: center; gap: 6px;
        padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 500;
        cursor: pointer; border: 1px solid var(--border-color);
        background: var(--bg-card); color: var(--text-primary); transition: all 0.15s;
    }
    .btn-sync:hover { background: rgba(0,0,0,0.04); }
    .btn-sync:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-action {
        display: inline-flex; align-items: center; gap: 6px;
        padding: 6px 14px; border-radius: 6px; font-size: 12px; font-weight: 600;
        cursor: pointer; border: none; transition: all 0.15s;
    }
    .btn-action.primary { background: var(--accent-purple); color: white; }
    .btn-action.primary:hover { background: var(--accent-purple-light); }
    .btn-action.primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-action.secondary { background: transparent; color: var(--text-secondary); border: 1px solid var(--border-color); }
    .btn-action.secondary:hover { background: rgba(0,0,0,0.04); }
    .btn-action.danger { background: rgba(239,68,68,0.1); color: var(--accent-red); }
    .btn-action.sm { padding: 4px 8px; font-size: 11px; }

    .toast {
        position: fixed; bottom: 24px; right: 24px; z-index: 1100;
        padding: 12px 20px; border-radius: 10px; font-size: 13px; font-weight: 500;
        box-shadow: 0 8px 24px rgba(0,0,0,0.15); transition: all 0.3s;
        display: flex; align-items: center; gap: 8px;
    }
    .toast.success { background: var(--accent-green); color: #fff; }
    .toast.error { background: var(--accent-red); color: #fff; }
    .toast.info { background: var(--accent-purple); color: #fff; }

    .product-preview { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; background: var(--bg-primary); }

    .modal-overlay {
        position: fixed; inset: 0; background: rgba(0,0,0,0.5);
        z-index: 50; display: flex; align-items: center; justify-content: center;
    }
    .modal-content {
        background: var(--bg-card); border: 1px solid var(--border-color);
        border-radius: 16px; padding: 24px; width: 90%; max-width: 600px;
        max-height: 80vh; overflow-y: auto;
    }

    /* Vault media grid */
    .vault-media-grid {
        display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 10px;
    }
    .vault-media-card {
        background: var(--bg-primary); border: 1px solid var(--border-color);
        border-radius: 8px; overflow: hidden; cursor: pointer;
        transition: all 0.15s; position: relative;
    }
    .vault-media-card:hover { border-color: var(--accent-purple); transform: translateY(-1px); }
    .vault-media-card.selected { border-color: var(--accent-purple); box-shadow: 0 0 0 2px rgba(108,99,255,0.2); }
    .vault-media-thumb {
        width: 100%; aspect-ratio: 1; object-fit: cover; background: var(--bg-card);
        display: flex; align-items: center; justify-content: center; font-size: 20px; color: var(--text-tertiary);
    }
    .vault-media-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .vault-media-info { padding: 6px 8px; }
    .vault-media-type { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-tertiary); }
    .vault-media-name { font-size: 11px; font-weight: 500; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .vault-media-check {
        position: absolute; top: 4px; right: 4px; width: 18px; height: 18px;
        border-radius: 4px; border: 2px solid rgba(255,255,255,0.8); background: rgba(0,0,0,0.3);
        display: flex; align-items: center; justify-content: center; color: white; font-size: 9px;
    }
    .vault-media-check.checked { background: var(--accent-purple); border-color: var(--accent-purple); }

    .folder-pills { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .folder-pill {
        display: inline-flex; align-items: center; gap: 4px;
        padding: 4px 10px; border-radius: 16px; font-size: 12px; font-weight: 500;
        cursor: pointer; transition: all 0.15s; border: 1px solid var(--border-color);
        background: var(--bg-card); color: var(--text-secondary);
    }
    .folder-pill:hover { background: rgba(0,0,0,0.04); }
    .folder-pill.active { background: rgba(108,99,255,0.15); color: var(--accent-purple); border-color: var(--accent-purple); }

    .upload-dropzone {
        border: 2px dashed var(--border-color); border-radius: 12px;
        padding: 24px 16px; text-align: center; cursor: pointer; transition: all 0.15s;
    }
    .upload-dropzone:hover { border-color: var(--accent-purple); background: rgba(108,99,255,0.04); }
    .upload-dropzone.dragover { border-color: var(--accent-purple); background: rgba(108,99,255,0.08); }

    .pagination { display: flex; align-items: center; gap: 4px; margin-top: 16px; justify-content: center; }
    .page-btn {
        padding: 6px 10px; border-radius: 6px; font-size: 12px; font-weight: 500;
        cursor: pointer; border: 1px solid var(--border-color); background: var(--bg-card);
        color: var(--text-primary); transition: all 0.15s;
    }
    .page-btn:hover { background: rgba(0,0,0,0.04); }
    .page-btn.active { background: var(--accent-purple); color: white; border-color: var(--accent-purple); }
    .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
</style>
{% endblock %}

{% block content %}
<div x-data="vaultApp()" x-init="init()" data-creator-id="{{ creator_id }}">

    <div id="toast" class="toast" style="display:none;"></div>

    <div class="page-header" style="display:flex;justify-content:space-between;align-items:flex-start;">
        <div>
            <h2>Vault</h2>
            <p>Manage products, media, and deliveries.</p>
        </div>
        <div style="display:flex;gap:8px;">
            <a href="/dashboard/drops" class="btn-action primary" x-show="dropfansConnected">
                <i class="fas fa-box"></i> Create Drop
            </a>
        </div>
    </div>

    <div x-show="error" class="error-state" x-text="error"></div>

    <div x-show="loading" class="loading-text">
        <i class="fas fa-spinner fa-spin"></i> Loading vault...
    </div>

    <template x-if="!loading">
        <div>
            <!-- KPI Cards -->
            <div class="vault-grid" style="margin-bottom: 20px;">
                <div class="stat-card purple">
                    <div class="stat-top">
                        <span class="stat-label">Products</span>
                        <div class="stat-icon purple"><i class="fas fa-box"></i></div>
                    </div>
                    <div class="stat-value" x-text="overview?.products?.total ?? 0"></div>
                    <div class="stat-sub" x-text="(overview?.products?.total_media ?? 0) + ' media items'"></div>
                </div>
                <div class="stat-card green">
                    <div class="stat-top">
                        <span class="stat-label">Deliveries</span>
                        <div class="stat-icon green"><i class="fas fa-paper-plane"></i></div>
                    </div>
                    <div class="stat-value" x-text="overview?.deliveries?.total ?? 0"></div>
                    <div class="stat-sub" x-text="(overview?.deliveries?.unique_fans ?? 0) + ' unique fans'"></div>
                </div>
                <div class="stat-card orange">
                    <div class="stat-top">
                        <span class="stat-label">Revenue</span>
                        <div class="stat-icon orange"><i class="fas fa-dollar-sign"></i></div>
                    </div>
                    <div class="stat-value" x-text="formatRevenue(overview?.products?.total_revenue)"></div>
                    <div class="stat-sub" x-text="(overview?.products?.total_unlocks ?? 0) + ' unlocks'"></div>
                </div>
                <div class="stat-card blue">
                    <div class="stat-top">
                        <span class="stat-label">Clicks</span>
                        <div class="stat-icon blue"><i class="fas fa-mouse-pointer"></i></div>
                    </div>
                    <div class="stat-value" x-text="overview?.products?.total_clicks ?? 0"></div>
                    <div class="stat-sub" x-text="conversionRate + '% conversion'"></div>
                </div>
            </div>

            <!-- Two Column Layout -->
            <div style="display: grid; grid-template-columns: 1fr 360px; gap: 20px;">
                <!-- Product Performance Table -->
                <div class="section-card">
                    <div class="section-header">
                        <h2><i class="fas fa-chart-bar" style="color: var(--accent-purple); margin-right: 8px;"></i>Products</h2>
                        <button @click="loadProducts()" class="btn-sync" :disabled="productsLoading">
                            <i class="fas" :class="productsLoading ? 'fa-spinner fa-spin' : 'fa-sync'"></i> Refresh
                        </button>
                    </div>
                    <div x-show="productsLoading" class="loading-text" style="padding: 16px 0;">
                        <i class="fas fa-spinner fa-spin"></i> Loading...
                    </div>
                    <div x-show="!productsLoading && products.length === 0" class="empty-state" style="padding: 24px 0;">
                        <i class="fas fa-box" style="font-size: 24px;"></i>
                        <p>No products yet</p>
                    </div>
                    <div x-show="!productsLoading && products.length > 0" style="overflow-x: auto;">
                        <table class="app-table">
                            <thead>
                                <tr>
                                    <th>Product</th>
                                    <th style="text-align: right;">Price</th>
                                    <th style="text-align: right;">Media</th>
                                    <th style="text-align: right;">Deliveries</th>
                                    <th style="text-align: right;">Revenue</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template x-for="p in products" :key="p.id">
                                    <tr>
                                        <td>
                                            <div style="display: flex; align-items: center; gap: 10px;">
                                                <img :src="p.preview_url || 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2240%22 height=%2240%22%3E%3Crect fill=%22%23E5E7EB%22 width=%2240%22 height=%2240%22/%3E%3C/svg%3E'"
                                                     class="product-preview" :alt="p.title">
                                                <div>
                                                    <div style="font-size: 13px; font-weight: 500; color: var(--text-primary);" x-text="p.title || 'Untitled'"></div>
                                                </div>
                                            </div>
                                        </td>
                                        <td style="text-align: right;">
                                            <span style="font-size: 13px; color: var(--text-primary);" x-text="formatPrice(p.price_minor)"></span>
                                        </td>
                                        <td style="text-align: right;">
                                            <span style="font-size: 13px; color: var(--text-secondary);" x-text="p.media_count"></span>
                                        </td>
                                        <td style="text-align: right;">
                                            <span style="font-size: 13px; font-weight: 600;" :style="'color:' + (p.delivery_count > 0 ? 'var(--accent-green)' : 'var(--text-tertiary)')" x-text="p.delivery_count"></span>
                                        </td>
                                        <td style="text-align: right;">
                                            <span style="font-size: 13px; font-weight: 500; color: var(--text-primary);" x-text="formatRevenue(p.total_earnings)"></span>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Right Sidebar -->
                <div style="display: flex; flex-direction: column; gap: 20px;">
                    <!-- Top Fans -->
                    <div class="section-card">
                        <div class="section-header">
                            <h2><i class="fas fa-trophy" style="color: var(--accent-orange); margin-right: 8px;"></i>Top Fans</h2>
                        </div>
                        <div x-show="!overview?.top_fans?.length" class="empty-state" style="padding: 16px 0;">
                            <p style="font-size: 13px;">No deliveries yet</p>
                        </div>
                        <div x-show="overview?.top_fans?.length > 0">
                            <template x-for="(fan, idx) in (overview?.top_fans || [])" :key="fan.user_id">
                                <div style="display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border-color);">
                                    <div style="width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: white;"
                                         :style="idx === 0 ? 'background: var(--accent-orange)' : idx === 1 ? 'background: var(--text-tertiary)' : idx === 2 ? 'background: #CD7F32' : 'background: var(--accent-purple)'"
                                         x-text="idx + 1"></div>
                                    <div style="flex: 1; min-width: 0;">
                                        <div style="font-size: 13px; font-weight: 500; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"
                                             x-text="fan.first_name || ('User ' + fan.user_id)"></div>
                                    </div>
                                    <div style="text-align: right;">
                                        <div style="font-size: 14px; font-weight: 600; color: var(--accent-green);" x-text="fan.delivery_count"></div>
                                        <div style="font-size: 10px; color: var(--text-tertiary);">media</div>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>

                    <!-- Recent Activity -->
                    <div class="section-card">
                        <div class="section-header">
                            <h2><i class="fas fa-clock" style="color: var(--accent-green); margin-right: 8px;"></i>Recent Activity</h2>
                        </div>
                        <div x-show="!overview?.recent_deliveries?.length" class="empty-state" style="padding: 16px 0;">
                            <p style="font-size: 13px;">No activity yet</p>
                        </div>
                        <div x-show="overview?.recent_deliveries?.length > 0" style="max-height: 400px; overflow-y: auto;">
                            <template x-for="d in (overview?.recent_deliveries || [])" :key="d.id">
                                <div style="display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border-color);">
                                    <div style="width: 28px; height: 28px; min-width: 28px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; background: rgba(74,222,128,0.15); color: var(--accent-green);">
                                        <i class="fas fa-check"></i>
                                    </div>
                                    <div style="flex: 1; min-width: 0;">
                                        <div style="font-size: 13px; color: var(--text-primary); line-height: 1.4;">
                                            <span x-text="d.first_name || ('User ' + d.user_id)"></span>
                                            <span style="color: var(--text-tertiary);"> received </span>
                                            <span style="font-weight: 500;" x-text="'media #' + d.fangate_media_id"></span>
                                        </div>
                                        <div style="font-size: 11px; color: var(--text-tertiary); margin-top: 2px;" x-text="formatDate(d.sent_at)"></div>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
            </div>

            <!-- DropFans Vault Section -->
            <div class="section-card" style="margin-top: 20px;" x-show="dropfansConnected">
                <div class="section-header">
                    <h2><i class="fas fa-cloud" style="color: var(--accent-purple); margin-right: 8px;"></i>DropFans Vault</h2>
                    <div style="display: flex; gap: 8px; align-items: center;">
                        <button @click="openUploadModal()" class="btn-action primary sm">
                            <i class="fas fa-cloud-upload-alt"></i> Upload
                        </button>
                        <button @click="openFolderModal()" class="btn-action secondary sm">
                            <i class="fas fa-folder-plus"></i> Folder
                        </button>
                        <button @click="loadDropfansVault()" class="btn-sync" :disabled="dfVaultLoading">
                            <i class="fas" :class="dfVaultLoading ? 'fa-spinner fa-spin' : 'fa-sync'"></i>
                        </button>
                    </div>
                </div>

                <!-- Folder pills -->
                <div class="folder-pills">
                    <span @click="dfFolderFilter = null; loadDropfansVault()" class="folder-pill" :class="!dfFolderFilter && 'active'">
                        <i class="fas fa-layer-group"></i> All
                    </span>
                    <template x-for="f in dfFolders" :key="f.id">
                        <span @click="dfFolderFilter = f.id; loadDropfansVault()" class="folder-pill" :class="dfFolderFilter === f.id && 'active'">
                            <i class="fas fa-folder"></i> <span x-text="f.name"></span>
                        </span>
                    </template>
                </div>

                <div x-show="dfVaultLoading" class="loading-text" style="padding: 16px 0;">
                    <i class="fas fa-spinner fa-spin"></i> Loading DropFans vault...
                </div>

                <div x-show="!dfVaultLoading && dfItems.length === 0" class="empty-state" style="padding: 24px 0;">
                    <i class="fas fa-photo-video" style="font-size: 24px;"></i>
                    <p>No media in DropFans vault</p>
                </div>

                <div x-show="!dfVaultLoading && dfItems.length > 0" class="vault-media-grid">
                    <template x-for="item in dfItems" :key="item.id">
                        <div class="vault-media-card" @click="dfDetailItem = item; showDetailModal = true">
                            <div class="vault-media-thumb">
                                <template x-if="item.file_type === 'image' && item.thumbnail_path">
                                    <img :src="item.thumbnail_path" :alt="item.file_name || 'Image'">
                                </template>
                                <template x-if="item.file_type === 'video'">
                                    <i class="fas fa-video"></i>
                                </template>
                                <template x-if="item.file_type === 'audio'">
                                    <i class="fas fa-music"></i>
                                </template>
                                <template x-if="!item.file_type || item.file_type === 'unknown'">
                                    <i class="fas fa-file"></i>
                                </template>
                            </div>
                            <div class="vault-media-info">
                                <div class="vault-media-type" x-text="item.file_type || 'unknown'"></div>
                                <div class="vault-media-name" x-text="item.file_name || item.id.slice(-10)"></div>
                            </div>
                        </div>
                    </template>
                </div>

                <!-- Pagination -->
                <div class="pagination" x-show="dfPagination.totalPages > 1">
                    <button class="page-btn" @click="dfGoPage(1)" :disabled="dfPagination.page <= 1"><i class="fas fa-angle-double-left"></i></button>
                    <button class="page-btn" @click="dfGoPage(dfPagination.page - 1)" :disabled="dfPagination.page <= 1"><i class="fas fa-angle-left"></i></button>
                    <template x-for="p in dfVisiblePages()" :key="p">
                        <button class="page-btn" :class="p === dfPagination.page && 'active'" @click="dfGoPage(p)" x-text="p"></button>
                    </template>
                    <button class="page-btn" @click="dfGoPage(dfPagination.page + 1)" :disabled="dfPagination.page >= dfPagination.totalPages"><i class="fas fa-angle-right"></i></button>
                    <button class="page-btn" @click="dfGoPage(dfPagination.totalPages)" :disabled="dfPagination.page >= dfPagination.totalPages"><i class="fas fa-angle-double-right"></i></button>
                </div>
            </div>

            <!-- DropFans Not Connected Banner -->
            <div class="section-card" style="margin-top: 20px;" x-show="!dropfansConnected && creatorId > 0">
                <div style="display:flex;align-items:center;gap:12px;">
                    <div style="width:40px;height:40px;border-radius:8px;background:rgba(251,146,60,0.15);display:flex;align-items:center;justify-content:center;">
                        <i class="fas fa-cloud" style="color:var(--accent-orange);"></i>
                    </div>
                    <div style="flex:1;">
                        <div style="font-size:14px;font-weight:600;color:var(--text-primary);">DropFans not connected</div>
                        <div style="font-size:12px;color:var(--text-tertiary);">Connect your DropFans API key to manage vault media directly.</div>
                    </div>
                    <a href="/dashboard/fangate" class="btn-action primary">
                        <i class="fas fa-plug"></i> Connect DropFans
                    </a>
                </div>
            </div>

            <!-- Upload Modal -->
            <div x-show="showUploadModal" @click="showUploadModal = false" class="modal-overlay" style="display:none;">
                <div @click.stop class="modal-content">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
                        <h3 style="font-size:16px;font-weight:600;color:var(--text-primary);">
                            <i class="fas fa-cloud-upload-alt" style="color:var(--accent-purple);margin-right:6px;"></i>
                            Upload to DropFans Vault
                        </h3>
                        <button @click="showUploadModal = false" style="background:none;border:none;cursor:pointer;color:var(--text-tertiary);font-size:18px;">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    <div class="upload-dropzone" @click="$refs.fileInput.click()"
                         @dragover.prevent="$el.classList.add('dragover')"
                         @dragleave="$el.classList.remove('dragover')"
                         @drop.prevent="handleDrop($event)">
                        <i class="fas fa-cloud-upload-alt" style="font-size:28px;color:var(--text-tertiary);margin-bottom:8px;display:block;"></i>
                        <p style="font-size:13px;color:var(--text-secondary);">Click or drag files here</p>
                        <p style="font-size:11px;color:var(--text-tertiary);margin-top:4px;">Images, Audio, Video up to 50MB</p>
                    </div>
                    <input x-ref="fileInput" type="file" multiple accept="image/*,audio/*,video/*" @change="handleFileSelect($event)" style="display:none;">
                    <div x-show="uploadFiles.length > 0" style="margin-top:12px;">
                        <div style="font-size:12px;color:var(--text-secondary);margin-bottom:8px;" x-text="uploadFiles.length + ' file(s) queued'"></div>
                        <div style="display:flex;gap:8px;justify-content:flex-end;">
                            <button @click="uploadFiles = []" class="btn-action secondary">Cancel</button>
                            <button @click="startUpload()" class="btn-action primary" :disabled="uploading">
                                <i class="fas" :class="uploading ? 'fa-spinner fa-spin' : 'fa-upload'"></i> Upload
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Folder Create Modal -->
            <div x-show="showFolderModal" @click="showFolderModal = false" class="modal-overlay" style="display:none;">
                <div @click.stop class="modal-content" style="max-width:400px;">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
                        <h3 style="font-size:16px;font-weight:600;color:var(--text-primary);">
                            <i class="fas fa-folder-plus" style="color:var(--accent-green);margin-right:6px;"></i>
                            Create Folder
                        </h3>
                        <button @click="showFolderModal = false" style="background:none;border:none;cursor:pointer;color:var(--text-tertiary);font-size:18px;">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    <input x-model="newFolderName" type="text" placeholder="Folder name"
                           @keydown.enter="createFolder()"
                           style="width:100%;padding:10px 14px;border:1px solid var(--border-color);border-radius:8px;font-size:14px;background:var(--bg-primary);color:var(--text-primary);margin-bottom:12px;">
                    <div style="display:flex;gap:8px;justify-content:flex-end;">
                        <button @click="showFolderModal = false" class="btn-action secondary">Cancel</button>
                        <button @click="createFolder()" class="btn-action primary" :disabled="!newFolderName.trim()">Create</button>
                    </div>
                </div>
            </div>

            <!-- Detail Modal -->
            <div x-show="showDetailModal" @click="showDetailModal = false" class="modal-overlay" style="display:none;">
                <div @click.stop class="modal-content" style="max-width:500px;">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
                        <h3 style="font-size:16px;font-weight:600;color:var(--text-primary);">
                            <i class="fas fa-info-circle" style="color:var(--accent-purple);margin-right:6px;"></i>
                            <span x-text="dfDetailItem?.file_name || 'Item Details'"></span>
                        </h3>
                        <button @click="showDetailModal = false" style="background:none;border:none;cursor:pointer;color:var(--text-tertiary);font-size:18px;">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    <div x-show="dfDetailItem" style="display:grid;gap:12px;font-size:13px;">
                        <div style="background:var(--bg-primary);border-radius:8px;overflow:hidden;min-height:100px;display:flex;align-items:center;justify-content:center;">
                                <template x-if="dfDetailItem?.file_type === 'image' && dfDetailItem?.thumbnail_path">
                                    <img :src="dfDetailItem.thumbnail_path" style="max-width:100%;max-height:250px;object-fit:contain;">
                            </template>
                            <template x-if="dfDetailItem?.file_type === 'video'">
                                <i class="fas fa-video" style="font-size:40px;color:var(--text-tertiary);"></i>
                            </template>
                            <template x-if="dfDetailItem?.file_type === 'audio'">
                                <i class="fas fa-music" style="font-size:40px;color:var(--text-tertiary);"></i>
                            </template>
                        </div>
                        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
                            <div><span style="color:var(--text-tertiary);">Type:</span> <span x-text="dfDetailItem?.file_type || '-'"></span></div>
                            <div><span style="color:var(--text-tertiary);">ID:</span> <span style="font-family:monospace;font-size:11px;" x-text="dfDetailItem?.id || '-'"></span></div>
                        </div>
                        <div style="display:flex;gap:8px;">
                            <button @click="deleteDfItem(dfDetailItem)" class="btn-action danger sm">
                                <i class="fas fa-trash"></i> Delete
                            </button>
                            <button @click="showDetailModal = false" class="btn-action secondary sm">Close</button>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </template>
</div>

<script>
function vaultApp() {
    return {
        creatorId: {{ creator_id }},
        loading: true,
        error: null,

        // Internal vault data
        overview: null,
        products: [],
        productsLoading: true,

        // DropFans connection
        dropfansConnected: false,

        // DropFans vault
        dfItems: [],
        dfVaultLoading: false,
        dfFolders: [],
        dfFolderFilter: null,
        dfPagination: { page: 1, limit: 24, total: 0, totalPages: 1 },

        // Upload
        showUploadModal: false,
        uploadFiles: [],
        uploading: false,

        // Folder
        showFolderModal: false,
        newFolderName: '',

        // Detail
        showDetailModal: false,
        dfDetailItem: null,

        async init() {
            await Promise.all([
                this.loadOverview(),
                this.loadProducts(),
                this.checkDropfansStatus(),
            ]);
            this.loading = false;
        },

        async api(path, opts = {}) {
            const resp = await fetch(path, opts);
            if (!resp.ok) {
                const body = await resp.json().catch(() => ({}));
                throw new Error(body.message || body.error || body.detail || `HTTP ${resp.status}`);
            }
            return resp.json();
        },

        showToast(msg, type) {
            const t = document.getElementById('toast');
            if (!t) return;
            t.textContent = msg;
            t.className = 'toast ' + (type || 'info');
            t.style.display = 'flex';
            clearTimeout(this._toastTimer);
            this._toastTimer = setTimeout(() => { t.style.display = 'none'; }, 3000);
        },

        // ── Internal vault ────────────────────────────────────────────

        async loadOverview() {
            try {
                this.overview = await this.api('/api/vault/analytics/overview');
            } catch (e) {
                // Non-fatal — overview may not be available
            }
        },

        async loadProducts() {
            this.productsLoading = true;
            try {
                this.products = await this.api('/api/vault/analytics/products');
            } catch (e) {
                this.products = [];
            } finally {
                this.productsLoading = false;
            }
        },

        // ── DropFans status ───────────────────────────────────────────

        async checkDropfansStatus() {
            try {
                const data = await this.api(`/api/fangate/creators/${this.creatorId}/dropfans-status`);
                this.dropfansConnected = !!(data.status && data.status.dropfans_creator_id);
                if (this.dropfansConnected) {
                    await this.loadDropfansVault();
                    await this.loadDfFolders();
                }
            } catch (e) {
                this.dropfansConnected = false;
            }
        },

        // ── DropFans vault ────────────────────────────────────────────

        async loadDropfansVault() {
            this.dfVaultLoading = true;
            try {
                const params = new URLSearchParams({ page: this.dfPagination.page, limit: this.dfPagination.limit });
                if (this.dfFolderFilter) params.set('folder_id', this.dfFolderFilter);
                const data = await this.api(`/api/fangate/creators/${this.creatorId}/dropfans-vault?${params}`);
                this.dfItems = data.items || [];
                const p = data.pagination || {};
                this.dfPagination = {
                    page: p.page || 1, limit: p.limit || 24,
                    total: p.total || 0, totalPages: Math.ceil((p.total || 0) / (p.limit || 24)),
                };
            } catch (e) {
                this.dfItems = [];
            } finally {
                this.dfVaultLoading = false;
            }
        },

        async loadDfFolders() {
            try {
                const data = await this.api(`/api/fangate/creators/${this.creatorId}/dropfans-vault-folders`);
                this.dfFolders = data.folders || [];
            } catch (e) { /* non-fatal */ }
        },

        dfGoPage(p) {
            if (p < 1 || p > this.dfPagination.totalPages) return;
            this.dfPagination.page = p;
            this.loadDropfansVault();
        },
        dfVisiblePages() {
            const cur = this.dfPagination.page;
            const total = this.dfPagination.totalPages;
            const pages = [];
            for (let i = Math.max(1, cur - 2); i <= Math.min(total, cur + 2); i++) pages.push(i);
            return pages;
        },

        // ── Helpers ───────────────────────────────────────────────────

        formatRevenue(minor) {
            if (minor == null) return '$0';
            return '$' + (minor / 100).toFixed(2);
        },
        formatPrice(minor) {
            if (minor == null) return 'Free';
            return '$' + (minor / 100).toFixed(2);
        },
        formatDate(iso) {
            if (!iso) return '—';
            const d = new Date(iso);
            const now = new Date();
            const diffMs = now - d;
            const diffMins = Math.floor(diffMs / 60000);
            if (diffMins < 1) return 'Just now';
            if (diffMins < 60) return diffMins + 'm ago';
            const diffHrs = Math.floor(diffMins / 60);
            if (diffHrs < 24) return diffHrs + 'h ago';
            const diffDays = Math.floor(diffHrs / 24);
            if (diffDays < 7) return diffDays + 'd ago';
            return d.toLocaleDateString();
        },
        get conversionRate() {
            const clicks = this.overview?.products?.total_clicks || 0;
            const unlocks = this.overview?.products?.total_unlocks || 0;
            if (clicks === 0) return '0';
            return Math.round((unlocks / clicks) * 100);
        },

        // ── Upload ────────────────────────────────────────────────────

        openUploadModal() { this.uploadFiles = []; this.showUploadModal = true; },
        handleFileSelect(e) { this.uploadFiles.push(...Array.from(e.target.files || [])); },
        handleDrop(e) { this.uploadFiles.push(...Array.from(e.dataTransfer.files || [])); e.target.classList?.remove('dragover'); },

        async startUpload() {
            if (this.uploadFiles.length === 0) return;
            this.uploading = true;
            for (const file of this.uploadFiles) {
                try {
                    const fd = new FormData();
                    fd.append('file', file);
                    const ext = file.name.split('.').pop().toLowerCase();
                    let ft = 'image';
                    if (['mp4','mov','avi','webm'].includes(ext)) ft = 'video';
                    else if (['mp3','wav','ogg','m4a'].includes(ext)) ft = 'audio';
                    fd.append('file_type', ft);
                    fd.append('original_name', file.name);
                    await fetch(`/api/fangate/creators/${this.creatorId}/dropfans-vault`, { method: 'POST', body: fd });
                } catch (e) { /* continue */ }
            }
            this.uploading = false;
            this.showUploadModal = false;
            this.showToast('Upload complete', 'success');
            await this.loadDropfansVault();
        },

        // ── Folder ────────────────────────────────────────────────────

        openFolderModal() { this.newFolderName = ''; this.showFolderModal = true; },
        async createFolder() {
            if (!this.newFolderName.trim()) return;
            try {
                await this.api(`/api/fangate/creators/${this.creatorId}/dropfans-vault-folders`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: this.newFolderName }),
                });
                this.showFolderModal = false;
                this.showToast('Folder created', 'success');
                await this.loadDfFolders();
            } catch (e) { this.showToast('Failed: ' + e.message, 'error'); }
        },

        // ── Delete ────────────────────────────────────────────────────

        async deleteDfItem(item) {
            if (!confirm('Delete "' + (item.file_name || item.id) + '"?')) return;
            try {
                await this.api(`/api/fangate/creators/${this.creatorId}/dropfans-vault/${item.id}`, { method: 'DELETE' });
                this.showDetailModal = false;
                this.showToast('Deleted', 'success');
                await this.loadDropfansVault();
            } catch (e) { this.showToast('Failed: ' + e.message, 'error'); }
        },
    };
}
</script>
{% endblock %}
