services:
  - type: web
    name: chatbot-ingestion
    runtime: python
    buildCommand: pip install -e ".[dev]"
    startCommand: python -m ingestion.main --mode polling
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false
      - key: OPERATOR_BOT_TOKEN
        sync: false
      - key: OPERATOR_TELEGRAM_IDS
        value: "6125780974"
      - key: OPENAI_API_KEY
        sync: false
      - key: POSTGRES_DSN
        sync: false
      - key: REDIS_URL
        sync: false
      - key: WEBHOOK_URL
        value: "https://chatbot-ingestion.onrender.com"
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: MODEL_NAME
        value: "meta-llama/llama-4-scout-17b-16e-instruct"
      - key: CHEAP_MODEL
        value: "meta-llama/llama-4-scout-17b-16e-instruct"
      - key: AUTO_APPROVE_THRESHOLD
        value: "0.80"
      - key: MAX_TOKENS
        value: "200"
      - key: TEMPERATURE
        value: "0.85"
      - key: PRESENCE_PENALTY
        value: "0.5"
      - key: FREQUENCY_PENALTY
        value: "0.3"
      - key: SUMMARIZE_EVERY_N
        value: "20"
      - key: DEBOUNCE_WINDOW_SECONDS
        value: "3"
      - key: RATE_LIMIT_PER_MINUTE
        value: "20"
      - key: USER_LOCK_TTL
        value: "60"

  - type: worker
    name: chatbot-llm-worker
    runtime: python
    buildCommand: pip install -e ".[dev]"
    startCommand: python -m workers.llm_worker --worker-id worker_1
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false
      - key: OPERATOR_BOT_TOKEN
        sync: false
      - key: OPERATOR_TELEGRAM_IDS
        value: "6125780974"
      - key: OPENAI_API_KEY
        sync: false
      - key: POSTGRES_DSN
        sync: false
      - key: REDIS_URL
        sync: false
      - key: MODEL_NAME
        value: "meta-llama/llama-4-scout-17b-16e-instruct"
      - key: CHEAP_MODEL
        value: "meta-llama/llama-4-scout-17b-16e-instruct"

  - type: worker
    name: chatbot-send-worker
    runtime: python
    buildCommand: pip install -e ".[dev]"
    startCommand: python -m workers.send_worker --worker-id sender_1
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false
      - key: OPERATOR_BOT_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: POSTGRES_DSN
        sync: false
      - key: REDIS_URL
        sync: false

  - type: web
    name: chatbot-web-dashboard
    runtime: python
    buildCommand: pip install -e ".[dev]"
    startCommand: python -m operator_dashboard.dashboard_worker --mode web --port 8080
    envVars:
      - key: POSTGRES_DSN
        sync: false
      - key: REDIS_URL
        sync: false
      - key: TELEGRAM_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  - type: worker
    name: chatbot-operator-dashboard
    runtime: python
    buildCommand: pip install -e ".[dev]"
    startCommand: python -m operator_dashboard.dashboard_worker --mode bot
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false
      - key: OPERATOR_BOT_TOKEN
        sync: false
      - key: OPERATOR_TELEGRAM_IDS
        value: "6125780974"
      - key: OPENAI_API_KEY
        sync: false
      - key: POSTGRES_DSN
        sync: false
      - key: REDIS_URL
        sync: false

databases:
  - name: chatbot-postgres
    region: oregon
    plan: free
